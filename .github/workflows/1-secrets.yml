# Robot 1: looks for passwords and keys in the whole Git history.
name: 1 - Secrets (Gitleaks)

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Get the code, with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp/gitleaks

      - name: Scan every commit
        run: /tmp/gitleaks/gitleaks git --redact -v
