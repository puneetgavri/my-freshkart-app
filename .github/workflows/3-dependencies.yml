# Robot 3: looks for known weaknesses in our libraries and our container image.
name: 3 - Libraries and image (Trivy)

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    env:
      # Never use Trivy 0.69.4, 0.69.5 or 0.69.6. Those builds were malicious (March 2026).
      TRIVY_VERSION: "0.74.0"
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          mkdir -p /tmp/trivy
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /tmp/trivy

      - name: Scan the libraries in requirements.txt
        run: /tmp/trivy/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 .

      - name: Build the container image
        run: docker build -t freshcart:${{ github.sha }} .

      - name: Scan the container image
        run: /tmp/trivy/trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 freshcart:${{ github.sha }}
